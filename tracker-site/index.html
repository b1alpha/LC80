<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sneaky Pete — LC80 Build Tracker</title>
<style>
  body { background: #1a1a1a; color: #e0e0e0; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
  h1 { background: #111; color: #f0a500; padding: 18px 24px; margin: 0; font-size: 1.4em; letter-spacing: 1px; }
  .tab-bar { background: #222; padding: 8px 16px; display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 2px solid #f0a500; }
  .tab-btn { background: #333; color: #ccc; border: none; padding: 7px 16px; border-radius: 4px 4px 0 0; cursor: pointer; font-size: 0.9em; transition: background 0.15s; }
  .tab-btn:hover { background: #444; color: #fff; }
  .tab-btn.active { background: #f0a500; color: #111; font-weight: bold; }
  .tab-content { padding: 16px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 0.88em; }
  th { background: #2a2a2a; color: #f0a500; padding: 8px 10px; text-align: left; border: 1px solid #333; white-space: nowrap; }
  td { padding: 7px 10px; border: 1px solid #2e2e2e; vertical-align: top; }
  #tab-Project-Tracker { overflow-x: auto; }
  #tab-Project-Tracker table { width: 100%; table-layout: auto; border-collapse: collapse; }
  #tab-Project-Tracker td,
  #tab-Project-Tracker th { padding: 10px 14px; line-height: 1.5; vertical-align: top; }
  #tab-Project-Tracker .sortable-header th { cursor: pointer; user-select: none; white-space: nowrap; }
  #tab-Project-Tracker .sortable-header th:hover { background: #3a3a2a; color: #ffd050; }
  #tab-Project-Tracker tr.parts-sub td { padding: 5px 14px 5px 32px; border-top: none; font-size: 0.92em; color: #bbb; line-height: 1.7; }
  #tab-Project-Tracker tr.parts-sub td strong { color: #f0a500; }
  #tab-Project-Tracker tr.project-main td { border-bottom: none; }
  #tab-Project-Tracker tr.project-main + tr.parts-sub + tr:not(.parts-sub) td,
  #tab-Project-Tracker tr.parts-sub:last-child td { border-bottom: 1px solid #2e2e2e; }
  #projectBody.hide-done tr.status-done { display: none; }
  #tab-2026-Strategy td.strat-check { text-align: center; width: 36px; padding: 6px 4px; }
  #tab-2026-Strategy input[type="checkbox"] { width: 18px; height: 18px; accent-color: #f0a500; cursor: pointer; }
  #tab-Spend-Summary th,
  #tab-Spend-Summary td { padding-top: 4px; padding-bottom: 4px; line-height: 1.25; }
  #tab-Spend-Summary th:first-child,
  #tab-Spend-Summary td:first-child { min-width: 180px; width: 180px; white-space: nowrap; }
  tr:hover td { background: rgba(240,165,0,0.06); }
  tr.status-done td   { background: #1a2e1a; }
  tr.status-warn td   { background: #2e2a10; }
  tr.status-urgent td { background: #2e1a1a; }
  tr.status-planned td{ background: #1a1e2e; }
  tr.status-low td    { background: #252520; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; padding: 10px 16px; background: #111; font-size: 0.8em; border-bottom: 1px solid #333; }
  .leg { display: flex; align-items: center; gap: 6px; }
  .leg-dot { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  .leg-done    { background: #1a2e1a; border: 1px solid #2a4a2a; }
  .leg-warn    { background: #2e2a10; border: 1px solid #4a3a10; }
  .leg-urgent  { background: #2e1a1a; border: 1px solid #4a2a2a; }
  .leg-planned { background: #1a1e2e; border: 1px solid #2a2e4a; }
  .leg-low     { background: #252520; border: 1px solid #3a3a30; }
</style>
<style>
<style>
  .build-page { max-width: 1100px; }
  .build-vitals { background: #111; border: 1px solid #f0a500; border-radius: 6px; padding: 16px 20px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
  .build-vitals-title { color: #f0a500; font-size: 1.1em; font-weight: bold; width: 100%; margin-bottom: 4px; }
  .vital-item { font-size: 0.88em; color: #ccc; }
  .vital-item strong { color: #fff; }
  .vital-divider { color: #444; }
  .build-power-bar { width: 100%; margin-top: 10px; }
  .power-label { font-size: 0.8em; color: #aaa; margin-bottom: 4px; }
  .bar-track { background: #2a2a2a; border-radius: 4px; height: 14px; width: 100%; position: relative; overflow: hidden; }
  .bar-fill-installed { background: linear-gradient(90deg, #2a7a2a, #3db33d); height: 100%; border-radius: 4px 0 0 4px; width: 55%; }
  .bar-fill-target { background: linear-gradient(90deg, #3db33d, #f0a500); height: 100%; position: absolute; left: 55%; width: 22%; top: 0; }
  .bar-markers { display: flex; justify-content: space-between; font-size: 0.72em; color: #666; margin-top: 3px; }
  .bar-marker-installed { color: #3db33d; font-weight: bold; }
  .bar-marker-target { color: #f0a500; font-weight: bold; }
  .build-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .build-card { background: #1e1e1e; border: 1px solid #2e2e2e; border-radius: 6px; overflow: hidden; }
  .build-card-header { background: #252525; padding: 9px 14px; font-size: 0.82em; font-weight: bold; color: #f0a500; letter-spacing: 0.5px; text-transform: uppercase; border-bottom: 1px solid #2e2e2e; display: flex; align-items: center; gap: 8px; }
  .build-card-header .card-icon { font-size: 1.1em; }
  .build-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 14px; border-bottom: 1px solid #222; font-size: 0.86em; }
  .build-item:last-child { border-bottom: none; }
  .build-item .bi-status { font-size: 1.1em; flex-shrink: 0; width: 22px; text-align: center; margin-top: 1px; }
  .build-item .bi-body { flex: 1; }
  .build-item .bi-name { color: #e0e0e0; font-weight: 500; }
  .build-item .bi-name.installed { color: #5ecf5e; }
  .build-item .bi-note { color: #777; font-size: 0.85em; margin-top: 2px; }
  .build-item .bi-tag { display: inline-block; font-size: 0.75em; padding: 1px 6px; border-radius: 3px; margin-top: 3px; font-weight: bold; margin-right: 4px; }
  .tag-installed { background: #1a3a1a; color: #5ecf5e; border: 1px solid #2a4a2a; }
  .tag-urgent { background: #3a1a1a; color: #f07070; border: 1px solid #4a2a2a; }
  .tag-planned { background: #1a1e3a; color: #7090e0; border: 1px solid #2a2e4a; }
  .tag-onhand { background: #2a2a1a; color: #d0b050; border: 1px solid #4a3a10; }
  .tag-ordered { background: #1a2a2a; color: #50c0c0; border: 1px solid #1a4a4a; }
  .build-summary { background: #111; border: 1px solid #333; border-radius: 6px; padding: 12px 16px; margin-bottom: 18px; font-size: 0.84em; color: #aaa; display: flex; gap: 24px; flex-wrap: wrap; }
  .bs-item strong { color: #fff; font-size: 1.1em; }
  .bs-item .bs-label { font-size: 0.8em; color: #666; display: block; }
</style>
</style>
</head>
<body>
<h1>🚙 Sneaky Pete — 1993 LC80 HDJ81 Build Tracker</h1>
<div class="legend">
  <div class="leg"><span class="leg-dot leg-done"></span> ✅ Done</div>
  <div class="leg"><span class="leg-dot leg-warn"></span> ⚠️ Attention / Overdue</div>
  <div class="leg"><span class="leg-dot leg-urgent"></span> 🔴 Urgent</div>
  <div class="leg"><span class="leg-dot leg-planned"></span> 🔵 / 🔩 Planned / Deferred</div>
  <div class="leg"><span class="leg-dot leg-low"></span> 🟡 Low Priority</div>
</div>
<div class="tab-bar">
<button class="tab-btn active" onclick="showTab('Build')">🔧 Build</button>
<button class="tab-btn " onclick="showTab('Fluid Guide')">Fluid Guide</button>
<button class="tab-btn " onclick="showTab('2026 Strategy')">2026 Strategy</button>
<button class="tab-btn " onclick="showTab('Project Tracker')">Project Tracker</button>
<button class="tab-btn " onclick="showTab('Parts Inventory')">Parts Inventory</button>
<button class="tab-btn " onclick="showTab('Spend Summary')">Spend Summary</button>
<button class="tab-btn " onclick="showTab('Scheduled Maintenance')">Scheduled Maintenance</button>

<div id="tab-Build" class="tab-content" style="display:block"></div>
<div id="tab-Fluid-Guide" class="tab-content" style="display:none"></div>
<div id="tab-2026-Strategy" class="tab-content" style="display:none"></div>
<div id="tab-Project-Tracker" class="tab-content" style="display:none"></div>
<div id="tab-Parts-Inventory" class="tab-content" style="display:none"></div>
<div id="tab-Spend-Summary" class="tab-content" style="display:none"></div>
<div id="tab-Scheduled-Maintenance" class="tab-content" style="display:none"></div>
<div id="tab-Shop-Contacts" class="tab-content" style="display:none"></div>
<script>
function showTab(name) {
  document.querySelectorAll('.tab-content').forEach(function(el) { el.style.display='none'; });
  document.querySelectorAll('.tab-btn').forEach(function(el) { el.classList.remove('active'); });
  var id = name.replace(/ /g, '-');
  var el = document.getElementById('tab-' + id);
  if (el) el.style.display = 'block';
  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    if (btn.textContent === name) btn.classList.add('active');
  });
  window.location.hash = name.replace(/ /g, '-').toLowerCase();
}

var projectSortDir = {};
function sortProjectTable(colIdx) {
  var tbody = document.getElementById('projectBody');
  if (!tbody) return;
  var allRows = Array.from(tbody.querySelectorAll('tr'));
  var groups = [];
  var current = null;
  allRows.forEach(function(row) {
    if (row.classList.contains('project-main')) {
      current = { main: row, subs: [] };
      groups.push(current);
    } else if (current) {
      current.subs.push(row);
    }
  });
  var dir = projectSortDir[colIdx] === 'asc' ? 'desc' : 'asc';
  projectSortDir[colIdx] = dir;
  groups.sort(function(a, b) {
    var aCell = a.main.cells[colIdx];
    var bCell = b.main.cells[colIdx];
    if (!aCell || !bCell) return 0;
    var aVal = aCell.textContent.trim();
    var bVal = bCell.textContent.trim();
    var aNum = parseFloat(aVal);
    var bNum = parseFloat(bVal);
    if (!isNaN(aNum) && !isNaN(bNum)) {
      return dir === 'asc' ? aNum - bNum : bNum - aNum;
    }
    return dir === 'asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
  });
  groups.forEach(function(g) {
    tbody.appendChild(g.main);
    g.subs.forEach(function(s) { tbody.appendChild(s); });
  });
  applyDoneVisibility();
}

var doneHidden = true;
function applyDoneVisibility() {
  var btn = document.getElementById('toggleDoneBtn');
  if (btn) {
    btn.textContent = doneHidden ? 'Show \u2705 Done' : 'Hide \u2705 Done';
    btn.style.background = doneHidden ? '#f0a500' : '#333';
    btn.style.color = doneHidden ? '#111' : '#ccc';
  }
  var tbody = document.getElementById('projectBody');
  if (!tbody) return;
  tbody.classList.toggle('hide-done', doneHidden);
  var inDoneGroup = false;
  Array.from(tbody.querySelectorAll('tr')).forEach(function(row) {
    if (row.classList.contains('project-main')) {
      inDoneGroup = row.classList.contains('status-done');
      row.style.display = (doneHidden && inDoneGroup) ? 'none' : '';
      return;
    }
    var rowIsDone = row.classList.contains('status-done') || inDoneGroup;
    row.style.display = (doneHidden && rowIsDone) ? 'none' : '';
  });
}

function toggleDoneRows() {
  doneHidden = !doneHidden;
  applyDoneVisibility();
}

function renderBuild(cards, meta) {
  var statusEmoji = { installed:'\u2705', urgent:'\ud83d\udd34', planned:'\ud83d\udd35', on_hand:'\u26a0\ufe0f', ordered:'\ud83d\udce6' };
  var tagClass = { 'INSTALLED':'tag-installed', 'DO FIRST':'tag-urgent', 'PLANNED':'tag-planned', 'PARTS ON HAND':'tag-onhand', 'ORDERED':'tag-ordered' };
  var html = '<div class="build-page">' +
    '<div class="build-vitals">' +
    '<div class="build-vitals-title">\ud83d\ude99 Sneaky Pete \u2014 Build Sheet</div>' +
    '<div class="vital-item"><strong>1993</strong> Toyota Land Cruiser HDJ81</div>' +
    '<div class="vital-divider">|</div>' +
    '<div class="vital-item"><strong>' + meta.engine.split(' ')[0] + '</strong> ' + meta.engine.split(' ').slice(1).join(' ') + '</div>' +
    '<div class="vital-divider">|</div>' +
    '<div class="vital-item"><strong>' + meta.transmission.split(' ')[0] + '</strong> ' + meta.transmission.split(' ').slice(1).join(' ') + '</div>' +
    '<div class="vital-divider">|</div>' +
    '<div class="vital-item"><strong>~' + meta.odometer_km.toLocaleString() + ' km</strong></div>' +
    '<div class="vital-divider">|</div>' +
    '<div class="vital-item"><strong>' + meta.color + ' \u00b7 ' + meta.tires + ' Tires</strong></div>' +
    '<div class="build-power-bar">' +
    '<div class="power-label">Torque progress: <span class="bar-marker-installed">~' + meta.torque_now_nm + 'NM now (est.)</span> \u2192 <span class="bar-marker-target">' + meta.torque_target_nm + 'NM target (pump tune)</span> \u2192 ' + meta.torque_max_nm + 'NM max recommended</div>' +
    '<div class="bar-track"><div class="bar-fill-installed"></div><div class="bar-fill-target"></div></div>' +
    '</div></div><div class="build-grid">';
  for (var i = 0; i < cards.length; i++) {
    var card = cards[i];
    html += '<div class="build-card"><div class="build-card-header"><span class="card-icon">' + card.icon + '</span> ' + card.category + '</div>';
    for (var j = 0; j < card.items.length; j++) {
      var item = card.items[j];
      var nameClass = item.status === 'installed' ? ' installed' : '';
      var tagsHtml = (item.tags || []).map(function(t) {
        return '<span class="bi-tag ' + (tagClass[t] || 'tag-planned') + '">' + t + '</span>';
      }).join('');
      html += '<div class="build-item">' +
        '<div class="bi-status">' + (statusEmoji[item.status] || '\ud83d\udd35') + '</div>' +
        '<div class="bi-body">' +
        '<div class="bi-name' + nameClass + '">' + item.name + '</div>' +
        '<div class="bi-note">' + item.note + '</div>' +
        tagsHtml +
        '</div></div>';
    }
    html += '</div>';
  }
  html += '</div></div>';
  document.getElementById('tab-Build').innerHTML = html;
}

function renderFluidGuide(rows) {
  var html = '<table><thead>' +
    '<tr><th colspan="7">\ud83d\udee2\ufe0f SNEAKY PETE \u2014 Fluid Buying Guide | What to Buy + How Much</th></tr>' +
    '<tr><th>System</th><th>Spec / Weight</th><th>Capacity</th><th>Buy This Amount</th><th>Brand Ideas</th><th>Status</th><th>Notes</th></tr>' +
    '</thead><tbody>';
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    html += '<tr><td>' + r.system + '</td><td>' + r.spec + '</td><td>' + r.capacity + '</td><td>' + r.buy_amount + '</td><td>' + r.brand + '</td><td>' + r.status + '</td><td>' + (r.notes || '') + '</td></tr>';
  }
  html += '</tbody></table>';
  document.getElementById('tab-Fluid-Guide').innerHTML = html;
}

function renderStrategy(phases) {
  var html = '<table><thead>' +
    '<tr><th colspan="7">\ud83d\udccb SNEAKY PETE \u2014 2026 Strategy &amp; Roadmap | Updated Feb 2026</th></tr>' +
    '<tr><th style="width:36px">\u2713</th><th>Priority</th><th>Task</th><th>Who</th><th>Est. Cost</th><th>Est. Time</th><th>Notes / Action</th></tr>' +
    '</thead><tbody>';
  for (var i = 0; i < phases.length; i++) {
    var phase = phases[i];
    html += '<tr><td colspan="7" style="background:#222;color:#f0a500;font-weight:bold;padding:10px 14px;">' + phase.phase + '</td></tr>';
    for (var j = 0; j < phase.tasks.length; j++) {
      var t = phase.tasks[j];
      var rowClass = t.priority === 'urgent' ? 'status-urgent' : t.priority === 'done' ? 'status-done' : 'status-low';
      var prioEmoji = t.priority === 'urgent' ? '\ud83d\udd34' : t.priority === 'done' ? '\u2705' : '\ud83d\udfe1';
      html += '<tr class="' + rowClass + '">' +
        '<td class="strat-check"><input type="checkbox" data-strat="' + t.id + '"' + (t.checked ? ' checked' : '') + '></td>' +
        '<td>' + prioEmoji + '</td>' +
        '<td>' + t.task + '</td><td>' + t.who + '</td>' +
        '<td>' + (t.cost_cad ? '~$' + t.cost_cad : '$0') + '</td>' +
        '<td>' + (t.time || '—') + '</td><td>' + (t.notes || '') + '</td>' +
        '</tr>';
    }
  }
  html += '</tbody></table>';
  document.getElementById('tab-2026-Strategy').innerHTML = html;
}

function renderProjectTracker(sections) {
  var statusClass = {
    'URGENT SERVICE': 'status-urgent', 'NEEDS INVESTIGATION': 'status-urgent',
    'BROKEN \u2014 REPLACE': 'status-urgent', 'NEEDS PARTS': 'status-urgent',
    'ONGOING TRACKING': 'status-urgent', 'LEAKING \u2014 NEEDS BOOKING': 'status-warn',
    'DONE': 'status-done', 'DEFERRED TO REBUILD': 'status-low', 'PLANNING QUOTE': 'status-low'
  };
  var html = '<div style="margin-bottom:10px;">' +
    '<button id="toggleDoneBtn" onclick="toggleDoneRows()" style="background:#333;color:#ccc;border:1px solid #555;padding:7px 16px;border-radius:4px;cursor:pointer;font-size:0.9em;">Hide \u2705 Done</button>' +
    '</div>' +
    '<table id="projectTable">' +
    '<colgroup><col style="width:22%"><col style="width:12%"><col style="width:14%"><col style="width:20%"><col style="width:8%"><col style="width:6%"><col style="width:10%"></colgroup>' +
    '<thead>' +
    '<tr><th colspan="7">\ud83d\udef3 SNEAKY PETE \u2014 LC80 HDJ81 Project Tracker | 170,000 km | 1HD-T | Updated Feb 2026</th></tr>' +
    '<tr><td colspan="7" style="padding:8px 14px;color:#aaa;font-size:0.85em;">\ud83d\udfe2 CAN DO NOW &nbsp; \ud83d\udfe1 NEEDS PARTS &nbsp; \ud83d\udd0d NEEDS INVESTIGATION &nbsp; \ud83d\udd35 SHOP JOB (Pending) &nbsp; \ud83d\udcc5 SCHEDULED 2026/27 &nbsp; \u2705 DONE</td></tr>' +
    '<tr class="sortable-header">' +
    '<th onclick="sortProjectTable(0)">Project \u21c5</th>' +
    '<th onclick="sortProjectTable(1)">Category \u21c5</th>' +
    '<th onclick="sortProjectTable(2)">Who \u21c5</th>' +
    '<th onclick="sortProjectTable(3)">Status \u21c5</th>' +
    '<th onclick="sortProjectTable(4)">Est. CAD \u21c5</th>' +
    '<th onclick="sortProjectTable(5)">Hrs \u21c5</th>' +
    '<th onclick="sortProjectTable(6)">Priority \u21c5</th>' +
    '</tr></thead><tbody id="projectBody">';
  for (var i = 0; i < sections.length; i++) {
    var section = sections[i];
    html += '<tr><td colspan="7" style="background:#222;color:#f0a500;font-weight:bold;padding:10px 14px;">' + section.section + '</td></tr>';
    for (var j = 0; j < section.projects.length; j++) {
      var p = section.projects[j];
      var rc = statusClass[p.status] || 'status-low';
      var isDone = p.status === 'DONE' ? ' status-done' : '';
      html += '<tr class="' + rc + ' project-main' + isDone + '">' +
        '<td>' + p.project + '</td><td>' + p.category + '</td><td>' + p.who + '</td>' +
        '<td>' + p.status + '</td><td>' + (p.cost_cad || 0) + '</td><td>' + (p.hours || 0) + '</td><td>' + (p.priority || '\u2014') + '</td>' +
        '</tr>';
      if (p.notes) html += '<tr class="parts-sub ' + rc + isDone + '"><td colspan="7">\ud83d\udcdd <strong>Notes:</strong> ' + p.notes + '</td></tr>';
      if (p.on_hand) html += '<tr class="parts-sub ' + rc + isDone + '"><td colspan="7">\ud83d\udce6 <strong>On Hand:</strong> ' + p.on_hand + '</td></tr>';
      if (p.still_needed) html += '<tr class="parts-sub ' + rc + isDone + '"><td colspan="7">\ud83d\udd0d <strong>Still Needed:</strong> ' + p.still_needed + '</td></tr>';
    }
  }
  html += '</tbody></table>';
  document.getElementById('tab-Project-Tracker').innerHTML = html;
  applyDoneVisibility();
}

function renderPartsInventory(parts) {
  var statusClass = { installed: 'status-done', on_hand: '', sold: '', used: 'status-done', reference: '' };
  var statusLabel = { installed:'\u2705 Installed', on_hand:'\ud83d\udce6 On Hand', sold:'\u21a9\ufe0f Sold', used:'\u2705 Used', reference:'\ud83d\udcd6 Reference' };
  var html = '<table><tbody>' +
    '<tr><th colspan="8">\ud83d\udce6 SNEAKY PETE \u2014 Parts Inventory | Updated Feb 2026</th></tr>' +
    '<tr><th>Part / Item</th><th>Vendor</th><th>Part Number</th><th>Price Paid</th><th>Currency</th><th>Approx. CAD</th><th>Project / Use</th><th>Status</th></tr>';
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i];
    var rc = statusClass[p.status] || '';
    html += '<tr class="' + rc + '"><td>' + p.name + '</td><td>' + p.vendor + '</td><td>' + (p.part_number || '\u2014') + '</td><td>' + (p.price_paid || '') + '</td><td>' + (p.currency || '') + '</td><td>' + (p.approx_cad || '') + '</td><td>' + (p.project || '') + '</td><td>' + (statusLabel[p.status] || p.status) + '</td></tr>';
  }
  html += '</tbody></table>';
  document.getElementById('tab-Parts-Inventory').innerHTML = html;
}

function renderSpendSummary(rows) {
  var html = '<table><tbody>' +
    '<tr><th colspan="4">\ud83d\udcb0 SNEAKY PETE \u2014 Spend Summary | All Invoices + Labour + Credits</th></tr>' +
    '<tr><th>Date</th><th>Vendor / Invoice</th><th>Description</th><th>Amount (CAD approx.)</th></tr>';
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    if (r.is_total) {
      html += '<tr class="status-warn"><td></td><td><strong>' + r.vendor + '</strong></td><td></td><td><strong>$' + r.amount_cad.toLocaleString() + '</strong></td></tr>';
    } else {
      html += '<tr><td>' + (r.date || '') + '</td><td>' + r.vendor + '</td><td>' + (r.description || '') + '</td><td>$' + (r.amount_cad || '').toLocaleString() + '</td></tr>';
    }
  }
  html += '</tbody></table>';
  document.getElementById('tab-Spend-Summary').innerHTML = html;
}

function renderScheduledMaintenance(items) {
  var rowClass = { ok:'status-done', upcoming:'status-planned', overdue:'status-warn', urgent:'status-urgent', deferred:'status-planned', due_soon:'status-low' };
  var html = '<table><tbody>' +
    '<tr><th colspan="8">\ud83d\udd27 SNEAKY PETE \u2014 Scheduled Maintenance | 1HD-T HDJ81 | Current: 170,000 km</th></tr>' +
    '<tr><th>Maintenance Item</th><th>Interval</th><th>Last Done (km)</th><th>Last Done (date/notes)</th><th>Next Due (km)</th><th>Km Until Due</th><th>Status</th><th>Notes</th></tr>';
  for (var i = 0; i < items.length; i++) {
    var item = items[i];
    var rc = rowClass[item.status] || '';
    html += '<tr class="' + rc + '"><td>' + item.item + '</td><td>' + item.interval + '</td><td>' + (item.last_done_km || '\u2014') + '</td><td>' + (item.last_done_notes || '') + '</td><td>' + (item.next_due_km || '\u2014') + '</td><td>' + item.km_until_due + '</td><td>' + (item.status_label || item.status) + '</td><td>' + (item.notes || '') + '</td></tr>';
  }
  html += '</tbody></table>';
  document.getElementById('tab-Scheduled-Maintenance').innerHTML = html;
}

function renderShopContacts(contacts) {
  var html = '<table><tbody>' +
    '<tr><th colspan="6">\ud83c\udfea SNEAKY PETE \u2014 Trusted Shop Contacts</th></tr>' +
    '<tr><th>Shop / Person</th><th>Role</th><th>Location</th><th>Phone</th><th>Website / Notes</th><th>Speciality</th></tr>';
  for (var i = 0; i < contacts.length; i++) {
    var c = contacts[i];
    html += '<tr><td>' + c.name + '</td><td>' + c.role + '</td><td>' + (c.location || '\u2014') + '</td><td>' + (c.phone || '\u2014') + '</td><td>' + (c.contact || '\u2014') + '</td><td>' + c.specialty + '</td></tr>';
  }
  html += '</tbody></table>';
  document.getElementById('tab-Shop-Contacts').innerHTML = html;
}

// Load data and render all tabs
fetch('/data.json')
  .then(function(r) { return r.json(); })
  .then(function(data) {
    renderBuild(data.build, data.meta);
    renderFluidGuide(data.fluid_guide);
    renderStrategy(data.strategy_2026);
    renderProjectTracker(data.project_tracker);
    renderPartsInventory(data.parts_inventory);
    renderSpendSummary(data.spend_summary);
    renderScheduledMaintenance(data.scheduled_maintenance);
    renderShopContacts(data.shop_contacts);

    // Init strategy checkboxes after render
    var boxes = document.querySelectorAll('#tab-2026-Strategy input[type="checkbox"]');
    boxes.forEach(function(cb) {
      var key = cb.getAttribute('data-strat');
      if (!key) return;
      var saved = localStorage.getItem(key);
      if (saved === 'true') cb.checked = true;
      else if (saved === 'false') cb.checked = false;
      cb.addEventListener('change', function() {
        localStorage.setItem(key, cb.checked);
        var row = cb.closest('tr');
        if (!row) return;
        if (cb.checked) {
          row.className = 'status-done';
          var prioCell = row.cells[1];
          if (prioCell) prioCell.textContent = '\u2705';
        }
      });
    });

    // Re-apply active tab after render
    var hash = window.location.hash.replace('#', '');
    if (hash) {
      var tabName = hash.split('-').map(function(w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(' ');
      showTab(tabName);
    }
  });

// Handle direct navigation to a tab via URL hash
window.addEventListener('hashchange', function() {
  var hash = window.location.hash.replace('#', '');
  if (!hash) return;
  var tabName = hash.split('-').map(function(w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(' ');
  showTab(tabName);
});

applyDoneVisibility();
</script>
