<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sneaky Pete — LC80 Build Tracker</title>
<style>
  body { background: #1a1a1a; color: #e0e0e0; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
  h1 { background: #111; color: #f0a500; padding: 18px 24px; margin: 0; font-size: 1.4em; letter-spacing: 1px; }
  .tab-bar { background: #222; padding: 8px 16px; display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 2px solid #f0a500; }
  .tab-btn { background: #333; color: #ccc; border: none; padding: 7px 16px; border-radius: 4px 4px 0 0; cursor: pointer; font-size: 0.9em; transition: background 0.15s; }
  .tab-btn:hover { background: #444; color: #fff; }
  .tab-btn.active { background: #f0a500; color: #111; font-weight: bold; }
  .tab-content { padding: 16px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 0.88em; }
  th { background: #2a2a2a; color: #f0a500; padding: 8px 10px; text-align: left; border: 1px solid #333; white-space: nowrap; }
  td { padding: 7px 10px; border: 1px solid #2e2e2e; vertical-align: top; }
  #tab-2026-Strategy { max-width: 1400px; }
  .strat-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .strat-summary { color: #8f8f8f; font-size: 0.9em; }
  .strat-summary strong { color: #fff; font-size: 1.25em; }
  .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; align-items: start; }
  .col h3, .strat-done h3 { margin: 0 0 10px; font-size: 0.78em; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #f0a500; display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 6px; border-bottom: 1px solid #333; }
  .col-count { color: #777; font-weight: 500; letter-spacing: 0; }
  .col-empty { color: #555; font-size: 0.85em; padding: 8px 2px; }
  .task-card { display: flex; gap: 10px; background: #222; border: 1px solid #2e2e2e; border-radius: 4px; padding: 10px 12px 10px 10px; margin-bottom: 8px; position: relative; }
  .task-card.status-urgent { border-left: 3px solid #e03a3a; }
  .task-card.status-done { background: #1c231c; border-color: #2a3a2a; }
  .task-card.status-done .task-title { color: #9c9; text-decoration: line-through; }
  .task-body { flex: 1; min-width: 0; }
  .task-title { margin: 0; font-size: 0.95em; font-weight: 600; color: #f2f2f2; line-height: 1.35; }
  .task-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; font-size: 0.78em; color: #8f8f8f; line-height: 1.4; }
  .task-meta .task-who { color: #bdbdbd; }
  .phase-tag { color: #f0a500; border: 1px solid #5a4510; border-radius: 3px; padding: 0 5px; font-weight: 600; cursor: default; }
  .task-status { margin-top: 4px; font-size: 0.7em; letter-spacing: 0.5px; text-transform: uppercase; color: #777; }
  .task-need { margin-top: 6px; font-size: 0.85em; color: #f0a500; line-height: 1.4; }
  .task-more { margin-top: 6px; font-size: 0.82em; color: #bbb; }
  .task-more summary { cursor: pointer; color: #777; font-size: 0.95em; user-select: none; }
  .task-more summary:hover { color: #ccc; }
  .task-more p { margin: 6px 0 0; line-height: 1.5; }
  .task-more strong { color: #f0a500; }
  .strat-done { margin-top: 26px; }
  .done-list { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 18px; }
  @media (max-width: 1100px) { .board, .done-list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 620px) { .board, .done-list { grid-template-columns: repeat(1, minmax(0, 1fr)); } }
  #tab-Parts-Inventory details.parts-installed { margin-top: 18px; border: 1px solid #333; border-radius: 6px; background: #111; }
  #tab-Parts-Inventory details.parts-installed summary { cursor: pointer; padding: 10px 14px; font-weight: bold; color: #aaa; user-select: none; }
  #tab-Parts-Inventory details.parts-installed[open] summary { border-bottom: 1px solid #333; color: #f0a500; }
  #tab-Parts-Inventory details.parts-installed table { margin: 0; }
  #tab-Spend-Summary th,
  #tab-Spend-Summary td { padding-top: 4px; padding-bottom: 4px; line-height: 1.25; }
  #tab-Spend-Summary th:first-child,
  #tab-Spend-Summary td:first-child { min-width: 180px; width: 180px; white-space: nowrap; }
  tr:hover td { background: rgba(240,165,0,0.06); }
  tr.status-done td   { background: #1a2e1a; }
  tr.status-warn td   { background: #2e2a10; }
  tr.status-urgent td { background: #2e1a1a; }
  tr.status-planned td{ background: #1a1e2e; }
  tr.status-low td    { background: #252520; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; padding: 10px 16px; background: #111; font-size: 0.8em; border-bottom: 1px solid #333; }
  .leg { display: flex; align-items: center; gap: 6px; }
  .leg-dot { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  .leg-done    { background: #1a2e1a; border: 1px solid #2a4a2a; }
  .leg-warn    { background: #2e2a10; border: 1px solid #4a3a10; }
  .leg-urgent  { background: #2e1a1a; border: 1px solid #4a2a2a; }
  .leg-planned { background: #1a1e2e; border: 1px solid #2a2e4a; }
  .leg-low     { background: #252520; border: 1px solid #3a3a30; }
</style>
<style>
<style>
  .build-page { max-width: 1100px; }
  .build-vitals { background: #111; border: 1px solid #f0a500; border-radius: 6px; padding: 16px 20px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
  .build-vitals-title { color: #f0a500; font-size: 1.1em; font-weight: bold; width: 100%; margin-bottom: 4px; }
  .vital-item { font-size: 0.88em; color: #ccc; }
  .vital-item strong { color: #fff; }
  .vital-divider { color: #444; }
  .build-power-bar { width: 100%; margin-top: 10px; }
  .power-label { font-size: 0.8em; color: #aaa; margin-bottom: 4px; }
  .bar-track { background: #2a2a2a; border-radius: 4px; height: 14px; width: 100%; position: relative; overflow: hidden; }
  .bar-fill-installed { background: linear-gradient(90deg, #2a7a2a, #3db33d); height: 100%; border-radius: 4px 0 0 4px; width: 55%; }
  .bar-fill-target { background: linear-gradient(90deg, #3db33d, #f0a500); height: 100%; position: absolute; left: 55%; width: 22%; top: 0; }
  .bar-markers { display: flex; justify-content: space-between; font-size: 0.72em; color: #666; margin-top: 3px; }
  .bar-marker-installed { color: #3db33d; font-weight: bold; }
  .bar-marker-target { color: #f0a500; font-weight: bold; }
  .build-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .build-card { background: #1e1e1e; border: 1px solid #2e2e2e; border-radius: 6px; overflow: hidden; }
  .build-card-header { background: #252525; padding: 9px 14px; font-size: 0.82em; font-weight: bold; color: #f0a500; letter-spacing: 0.5px; text-transform: uppercase; border-bottom: 1px solid #2e2e2e; display: flex; align-items: center; gap: 8px; }
  .build-card-header .card-icon { font-size: 1.1em; }
  .build-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 14px; border-bottom: 1px solid #222; font-size: 0.86em; }
  .build-item:last-child { border-bottom: none; }
  .build-item .bi-status { font-size: 1.1em; flex-shrink: 0; width: 22px; text-align: center; margin-top: 1px; }
  .build-item .bi-body { flex: 1; }
  .build-item .bi-name { color: #e0e0e0; font-weight: 500; }
  .build-item .bi-name.installed { color: #5ecf5e; }
  .build-item .bi-note { color: #777; font-size: 0.85em; margin-top: 2px; }
  .build-item .bi-tag { display: inline-block; font-size: 0.75em; padding: 1px 6px; border-radius: 3px; margin-top: 3px; font-weight: bold; margin-right: 4px; }
  .tag-installed { background: #1a3a1a; color: #5ecf5e; border: 1px solid #2a4a2a; }
  .tag-urgent { background: #3a1a1a; color: #f07070; border: 1px solid #4a2a2a; }
  .tag-planned { background: #1a1e3a; color: #7090e0; border: 1px solid #2a2e4a; }
  .tag-onhand { background: #2a2a1a; color: #d0b050; border: 1px solid #4a3a10; }
  .tag-ordered { background: #1a2a2a; color: #50c0c0; border: 1px solid #1a4a4a; }
  .build-summary { background: #111; border: 1px solid #333; border-radius: 6px; padding: 12px 16px; margin-bottom: 18px; font-size: 0.84em; color: #aaa; display: flex; gap: 24px; flex-wrap: wrap; }
  .bs-item strong { color: #fff; font-size: 1.1em; }
  .bs-item .bs-label { font-size: 0.8em; color: #666; display: block; }
</style>
</style>
</head>
<body>
<h1>🚙 Sneaky Pete — 1993 LC80 HDJ81 Build Tracker</h1>
<div class="legend">
  <div class="leg"><span class="leg-dot leg-done"></span> ✅ Done</div>
  <div class="leg"><span class="leg-dot leg-warn"></span> ⚠️ Attention / Overdue</div>
  <div class="leg"><span class="leg-dot leg-urgent"></span> 🔴 Urgent</div>
  <div class="leg"><span class="leg-dot leg-planned"></span> 🔵 / 🔩 Planned / Deferred</div>
  <div class="leg"><span class="leg-dot leg-low"></span> 🟡 Low Priority</div>
</div>
<div class="tab-bar">
<button class="tab-btn active" onclick="showTab('Build')">🔧 Build</button>
<button class="tab-btn " onclick="showTab('Fluid Guide')">Fluid Guide</button>
<button class="tab-btn " onclick="showTab('2026 Strategy')">2026 Strategy</button>
<button class="tab-btn " onclick="showTab('Parts Inventory')">Parts Inventory</button>
<button class="tab-btn " onclick="showTab('Spend Summary')">Spend Summary</button>
<button class="tab-btn " onclick="showTab('Scheduled Maintenance')">Scheduled Maintenance</button>
<button class="tab-btn " onclick="showTab('Shop Contacts')">Shop Contacts</button>
</div>
<div id="tab-Build" class="tab-content" style="display:block"></div>
<div id="tab-Fluid-Guide" class="tab-content" style="display:none"></div>
<div id="tab-2026-Strategy" class="tab-content" style="display:none"></div>
<div id="tab-Parts-Inventory" class="tab-content" style="display:none"></div>
<div id="tab-Spend-Summary" class="tab-content" style="display:none"></div>
<div id="tab-Scheduled-Maintenance" class="tab-content" style="display:none"></div>
<div id="tab-Shop-Contacts" class="tab-content" style="display:none"></div>
<script type="module">
import {
  renderBuild, renderFluidGuide, renderStrategy,
  renderPartsInventory, renderSpendSummary, renderScheduledMaintenance,
  renderShopContacts, showTab
} from './render.js';

function tabNameFromHash(hash) {
  if (hash === 'project-tracker') hash = '2026-strategy';
  return hash.split('-').map(function(w) {
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(' ');
}

fetch('/data.json')
  .then(function(r) { return r.json(); })
  .then(function(data) {
    renderBuild(data.build, data.meta);
    renderFluidGuide(data.fluid_guide);
    renderStrategy(data.strategy_2026);
    renderPartsInventory(data.parts_inventory);
    renderSpendSummary(data.spend_summary);
    renderScheduledMaintenance(data.scheduled_maintenance);
    renderShopContacts(data.shop_contacts);

    var hash = window.location.hash.replace('#', '');
    if (hash) showTab(tabNameFromHash(hash));
  });

window.addEventListener('hashchange', function() {
  var hash = window.location.hash.replace('#', '');
  if (!hash) return;
  showTab(tabNameFromHash(hash));
});
</script>
</body>
