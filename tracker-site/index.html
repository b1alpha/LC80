<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sneaky Pete — LC80 Build Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { background: #1a1a1a; color: #e0e0e0; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
  h1 { background: #111; color: #f0a500; padding: 18px 24px; margin: 0; font-size: 1.4em; letter-spacing: 1px; }
  .tab-bar { background: #222; padding: 8px 16px; display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 2px solid #f0a500; }
  .tab-btn { background: #333; color: #ccc; border: none; padding: 7px 16px; border-radius: 4px 4px 0 0; cursor: pointer; font-size: 0.9em; transition: background 0.15s; }
  .tab-btn:hover { background: #444; color: #fff; }
  .tab-btn.active { background: #f0a500; color: #111; font-weight: bold; }
  .tab-content { padding: 16px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 0.88em; }
  th { background: #2a2a2a; color: #f0a500; padding: 8px 10px; text-align: left; border: 1px solid #333; white-space: nowrap; }
  td { padding: 7px 10px; border: 1px solid #2e2e2e; vertical-align: top; }
  /* 2026 Strategy — from the Claude Design mockup */
  #tab-2026-Strategy { padding: 0; background: #14130F; }
  .strat { --ink: #EDE8DC; --mute: #9C9686; --mute2: #B3AC9C; --dim: #6E695C; --panel: #1E1C16; --band: #24211A; --line: #35322A; --line2: #2A2822; --orange: #E8630A; --red: #FF6B4A; --amber: #D99A2B; --blue: #5B8FD6; --green: #43A567; --yellow: #E3C42E;
    color: var(--ink); font-family: 'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace; padding: 0 clamp(16px, 4vw, 48px) 64px; }
  .strat-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 36px 0 20px; border-bottom: 3px solid var(--ink); }
  .strat-eyebrow { font-size: 12px; letter-spacing: 0.18em; color: var(--mute); text-transform: uppercase; margin-bottom: 6px; }
  .strat-title { margin: 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: clamp(44px, 7vw, 76px); line-height: 0.92; letter-spacing: 0.01em; text-transform: uppercase; color: var(--ink); background: none; padding: 0; }
  .strat-facts { display: flex; gap: 20px; font-size: 12px; color: var(--mute2); text-align: right; }
  .strat-fact-label { color: var(--mute); letter-spacing: 0.14em; text-transform: uppercase; font-size: 10px; }
  .strat-fact-val { font-weight: 600; font-size: 15px; color: var(--ink); }
  .strat-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 20px 0; }
  .stat { background: var(--panel); border: 1px solid var(--line); padding: 16px 18px; }
  .stat-dark { background: #2A2822; border-color: #2A2822; }
  .stat-label { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mute); margin-bottom: 8px; }
  .stat-row { display: flex; align-items: baseline; gap: 8px; }
  .stat-big { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 34px; line-height: 1; }
  .stat-red { color: var(--red); }
  .stat-sub { font-size: 12px; color: var(--mute); }
  .stat-foot { font-size: 12px; margin-top: 10px; color: var(--mute2); }
  .stat-bar { height: 6px; background: #3A382F; margin-top: 10px; }
  .stat-bar-fill { height: 6px; background: var(--orange); }
  #strategyBody .board { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
  .strat-head-2027 { margin-top: 34px; padding: 24px 0 14px; border-bottom-color: var(--orange); }
  .strat-title-sm { font-size: clamp(32px, 4.5vw, 48px); }
  .strat-col { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--ink); }
  .strat-col.col-later { border-top-color: var(--orange); }
  .strat-col.strat-done { border-top-color: var(--green); margin-top: 14px; }
  .strat-col-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; padding: 16px 16px 10px; background: var(--band); border-bottom: 1px solid var(--line); }
  .strat-col-title { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 22px; line-height: 1; text-transform: uppercase; }
  .strat-col-head .col-count { font-size: 11px; color: var(--mute); }
  .strat-col-cost { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--mute2); }
  .col-empty { padding: 14px 16px; font-size: 12px; color: var(--dim); }
  .task-row { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line2); }
  .task-row:last-child { border-bottom: none; }
  .task-check { flex: none; padding-top: 1px; }
  #tab-2026-Strategy input[type="checkbox"] { width: 14px; height: 14px; margin: 0; display: block; accent-color: var(--orange); cursor: pointer; }
  .task-num { font-size: 11px; color: var(--dim); width: 22px; flex: none; padding-top: 2px; }
  .dot { width: 9px; height: 9px; flex: none; border-radius: 50%; display: inline-block; margin-top: 4px; background: var(--yellow); }
  .dot-urgent { background: var(--red); }
  .dot-done { background: var(--green); }
  .dot-low { background: var(--yellow); }
  .task-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .task-row .bi-name { font-size: 13px; font-weight: 600; color: var(--ink); }
  .task-row.status-done .bi-name { color: var(--mute2); text-decoration: line-through; }
  .task-row.local-override .bi-name::after { content: " · this device"; color: var(--dim); font-weight: normal; font-size: 0.85em; }
  .task-row .bi-meta, .task-row .bi-cost { font-size: 11px; color: var(--mute); }
  .task-row .bi-cost-split { color: var(--dim); }
  .task-row .bi-need { font-size: 11px; color: var(--amber); line-height: 1.5; }
  .task-row .bi-more { font-size: 11px; color: var(--mute2); }
  .task-row .bi-more summary { cursor: pointer; color: var(--dim); user-select: none; }
  .task-row .bi-more summary:hover { color: var(--ink); }
  .task-row .bi-more p { margin: 6px 0 0; line-height: 1.55; }
  .task-row .bi-more strong { color: var(--amber); }
  .parts-list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 4px 18px; }
  .parts-list li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 2px 8px; align-items: start; padding: 4px 0; border-bottom: 1px solid var(--line2); }
  .parts-list li .bi-tag { justify-self: start; }
  .parts-list .pl-item { color: var(--ink); font-weight: 500; }
  .parts-list .pl-note { grid-column: 2; color: var(--dim); font-size: 10.5px; }
  .task-tags { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex: none; }
  .strat .bi-tag { font-size: 10px; letter-spacing: 0.08em; padding: 2px 7px; border-radius: 0; text-transform: uppercase; font-weight: 500; font-style: normal; background: #2A2822; border: 1px solid #45423A; color: var(--mute2); margin: 0; }
  .strat .tag-red { background: #2A1712; border-color: var(--red); color: #FF8A6E; }
  .strat .tag-amber { background: #2A2210; border-color: var(--amber); color: #E3B85C; }
  .strat .tag-blue { background: #141C2A; border-color: var(--blue); color: #8FB4E8; }
  .strat .tag-green { background: #1B2A1F; border-color: var(--green); color: #7BC698; }
  .strat .tag-phase { cursor: default; }
  .strat-done .done-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .strat-done { margin-top: 34px; }
  .strat-done .done-list .task-row { border-bottom: 1px solid var(--line2); }
  @media (max-width: 720px) { .strat-done .done-list { grid-template-columns: minmax(0, 1fr); } }
  .strat-legend { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 11px; color: var(--mute2); letter-spacing: 0.06em; }
  .strat-legend span { display: flex; align-items: center; gap: 6px; }
  .strat-legend .dot { margin-top: 0; }
  #tab-Maintenance-Log td.log-date, #tab-Maintenance-Log td.log-km { white-space: nowrap; color: #bbb; }
  #tab-Maintenance-Log td.log-item { font-weight: 600; color: #f2f2f2; white-space: nowrap; }
  #tab-Fluid-Guide th:first-child,
  #tab-Fluid-Guide td:first-child { white-space: nowrap; min-width: 220px; font-weight: 600; color: #f2f2f2; }
  #tab-Spend-Summary th,
  #tab-Spend-Summary td { padding-top: 4px; padding-bottom: 4px; line-height: 1.25; }
  #tab-Spend-Summary th:first-child,
  #tab-Spend-Summary td:first-child { min-width: 180px; width: 180px; white-space: nowrap; }
  tr:hover td { background: rgba(240,165,0,0.06); }
  tr.status-done td   { background: #1a2e1a; }
  tr.status-warn td   { background: #2e2a10; }
  tr.status-urgent td { background: #2e1a1a; }
  tr.status-planned td{ background: #1a1e2e; }
  tr.status-low td    { background: #252520; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; padding: 10px 16px; background: #111; font-size: 0.8em; border-bottom: 1px solid #333; }
  .leg { display: flex; align-items: center; gap: 6px; }
  .leg-dot { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  .leg-done    { background: #1a2e1a; border: 1px solid #2a4a2a; }
  .leg-warn    { background: #2e2a10; border: 1px solid #4a3a10; }
  .leg-urgent  { background: #2e1a1a; border: 1px solid #4a2a2a; }
  .leg-planned { background: #1a1e2e; border: 1px solid #2a2e4a; }
  .leg-low     { background: #252520; border: 1px solid #3a3a30; }
</style>
<style>
<style>
  .build-page { max-width: 1100px; }
  .build-vitals { background: #111; border: 1px solid #f0a500; border-radius: 6px; padding: 16px 20px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
  .build-vitals-title { color: #f0a500; font-size: 1.1em; font-weight: bold; width: 100%; margin-bottom: 4px; }
  .vital-item { font-size: 0.88em; color: #ccc; }
  .vital-item strong { color: #fff; }
  .vital-divider { color: #444; }
  .build-power-bar { width: 100%; margin-top: 10px; }
  .power-label { font-size: 0.8em; color: #aaa; margin-bottom: 4px; }
  .bar-track { background: #2a2a2a; border-radius: 4px; height: 14px; width: 100%; position: relative; overflow: hidden; }
  .bar-fill-installed { background: linear-gradient(90deg, #2a7a2a, #3db33d); height: 100%; border-radius: 4px 0 0 4px; width: 55%; }
  .bar-fill-target { background: linear-gradient(90deg, #3db33d, #f0a500); height: 100%; position: absolute; left: 55%; width: 22%; top: 0; }
  .bar-markers { display: flex; justify-content: space-between; font-size: 0.72em; color: #666; margin-top: 3px; }
  .bar-marker-installed { color: #3db33d; font-weight: bold; }
  .bar-marker-target { color: #f0a500; font-weight: bold; }
  .build-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; align-items: start; }
  #tab-Build .build-grid { grid-template-columns: 2fr 1fr; align-items: start; }
  #tab-Build .build-left { column-count: 2; column-gap: 14px; }
  #tab-Build .build-left .build-card { break-inside: avoid; margin-bottom: 14px; }
  @media (max-width: 1000px) { #tab-Build .build-grid { grid-template-columns: 1fr 1fr; } #tab-Build .build-left { column-count: 1; } }
  @media (max-width: 640px) { #tab-Build .build-grid { grid-template-columns: minmax(0, 1fr); } }
  .build-card { background: #1e1e1e; border: 1px solid #2e2e2e; border-radius: 6px; overflow: hidden; }
  .build-card-header { background: #252525; padding: 9px 14px; font-size: 0.82em; font-weight: bold; color: #f0a500; letter-spacing: 0.5px; text-transform: uppercase; border-bottom: 1px solid #2e2e2e; display: flex; align-items: center; gap: 8px; }
  .build-card-header .card-icon { font-size: 1.1em; }
  .build-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 14px; border-bottom: 1px solid #222; font-size: 0.86em; }
  .build-item:last-child { border-bottom: none; }
  .build-item .bi-status { font-size: 1.1em; flex-shrink: 0; width: 22px; text-align: center; margin-top: 1px; }
  .build-item .bi-body { flex: 1; }
  .build-item .bi-name { color: #e0e0e0; font-weight: 500; }
  .build-item .bi-name.installed { color: #5ecf5e; }
  .build-item .bi-note { color: #777; font-size: 0.85em; margin-top: 2px; }
  .build-item .bi-tag { display: inline-block; font-size: 0.75em; padding: 1px 6px; border-radius: 3px; margin-top: 3px; font-weight: bold; margin-right: 4px; }
  .tag-installed { background: #1a3a1a; color: #5ecf5e; border: 1px solid #2a4a2a; }
  .tag-urgent { background: #3a1a1a; color: #f07070; border: 1px solid #4a2a2a; }
  .tag-planned { background: #1a1e3a; color: #7090e0; border: 1px solid #2a2e4a; }
  .tag-onhand { background: #2a2a1a; color: #d0b050; border: 1px solid #4a3a10; }
  .tag-ordered { background: #1a2a2a; color: #50c0c0; border: 1px solid #1a4a4a; }
  .build-summary { background: #111; border: 1px solid #333; border-radius: 6px; padding: 12px 16px; margin-bottom: 18px; font-size: 0.84em; color: #aaa; display: flex; gap: 24px; flex-wrap: wrap; }
  .bs-item strong { color: #fff; font-size: 1.1em; }
  .bs-item .bs-label { font-size: 0.8em; color: #666; display: block; }
</style>
</style>
</head>
<body>
<h1>🚙 Sneaky Pete — 1993 LC80 HDJ81 Build Tracker</h1>
<div class="legend">
  <div class="leg"><span class="leg-dot leg-done"></span> ✅ Done</div>
  <div class="leg"><span class="leg-dot leg-warn"></span> ⚠️ Attention / Overdue</div>
  <div class="leg"><span class="leg-dot leg-urgent"></span> 🔴 Urgent</div>
  <div class="leg"><span class="leg-dot leg-planned"></span> 🔵 / 🔩 Planned / Deferred</div>
  <div class="leg"><span class="leg-dot leg-low"></span> 🟡 Low Priority</div>
</div>
<div class="tab-bar">
<button class="tab-btn active" onclick="showTab('Build')">🔧 Build</button>
<button class="tab-btn " onclick="showTab('Fluid Guide')">Fluid Guide</button>
<button class="tab-btn " onclick="showTab('2026 Strategy')">2026 Strategy</button>
<button class="tab-btn " onclick="showTab('Parts Inventory')">Parts Inventory</button>
<button class="tab-btn " onclick="showTab('Spend Summary')">Spend Summary</button>
<button class="tab-btn " onclick="showTab('Scheduled Maintenance')">Scheduled Maintenance</button>
<button class="tab-btn " onclick="showTab('Maintenance Log')">Maintenance Log</button>
<button class="tab-btn " onclick="showTab('Shop Contacts')">Shop Contacts</button>
</div>
<div id="tab-Build" class="tab-content" style="display:block"></div>
<div id="tab-Fluid-Guide" class="tab-content" style="display:none"></div>
<div id="tab-2026-Strategy" class="tab-content" style="display:none"></div>
<div id="tab-Parts-Inventory" class="tab-content" style="display:none"></div>
<div id="tab-Spend-Summary" class="tab-content" style="display:none"></div>
<div id="tab-Scheduled-Maintenance" class="tab-content" style="display:none"></div>
<div id="tab-Maintenance-Log" class="tab-content" style="display:none"></div>
<div id="tab-Shop-Contacts" class="tab-content" style="display:none"></div>
<script type="module">
import {
  renderBuild, renderFluidGuide, renderStrategy,
  renderPartsInventory, renderSpendSummary, renderScheduledMaintenance,
  renderMaintenanceLog, renderShopContacts, showTab
} from './render.js';

function tabNameFromHash(hash) {
  if (hash === 'project-tracker') hash = '2026-strategy';
  return hash.split('-').map(function(w) {
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(' ');
}

fetch('/data.json')
  .then(function(r) { return r.json(); })
  .then(function(data) {
    renderBuild(data.build, data.meta);
    renderFluidGuide(data.fluid_guide);
    renderStrategy(data.strategy_2026, data.meta);
    renderPartsInventory(data.parts_inventory);
    renderSpendSummary(data.spend_summary);
    renderScheduledMaintenance(data.scheduled_maintenance);
    renderMaintenanceLog(data.maintenance_log);
    renderShopContacts(data.shop_contacts);

    var hash = window.location.hash.replace('#', '');
    if (hash) showTab(tabNameFromHash(hash));
  });

window.addEventListener('hashchange', function() {
  var hash = window.location.hash.replace('#', '');
  if (!hash) return;
  showTab(tabNameFromHash(hash));
});
</script>
</body>
